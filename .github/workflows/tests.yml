name: Run tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tests of `shared` also run on Scala.js (sharedJS), with Node.js
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # LÖVE's release builds, downloaded by `love-client/luaPackage` (project/LovePackage.scala)
      - name: Cache LÖVE builds
        uses: actions/cache@v4
        with:
          path: target/love-*
          key: love-${{ hashFiles('project/LovePackage.scala') }}

      - name: Compile
        run: sbt compile

      - name: Run tests
        run: sbt test

      - name: Package the LÖVE clients
        run: sbt love-client/luaPackage
